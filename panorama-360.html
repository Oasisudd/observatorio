<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panorama 360 - Laguna Central Maricunga</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
  html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#000; }
  #panorama { width:100%; height:100%; }
</style>
</head>
<body>

<div id="panorama"></div>

<script>
  pannellum.viewer('panorama', {
    "type": "cylindrical",
    "panorama": "https://oasisudd.github.io/observatorio/panoramaLagunaCentralMaricunga.jpg",
    "autoLoad": true,
    "autoRotate": -2,
    "compass": false,
    "showZoomCtrl": true,
    "showFullscreenCtrl": true,
    "title": "Laguna Central Maricunga",
    "hfov": 100,
    "vaov": 50.7,
    "minHfov": 50,
    "maxHfov": 140
  });
</script>

</body>
</html>
