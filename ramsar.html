  // 6. Agregar la capa del Parque Nacional al mapa (ámbar/ocre, alto contraste con el turquesa del Ramsar)
  const PARQUE_COLOR = '#FF7BAC';
  const parqueLayer = L.geoJSON(parqueGeoJson, {
    style: {
      color: '#A66F1E',
      weight: 1.5,
      fillOpacity: 0.4,
      fillColor: PARQUE_COLOR
    },
    onEachFeature: (feature, layer) => {
      const p = feature.properties;
      layer.bindPopup(
        `<strong class="popup-title">${p.name}</strong><br>` +
        `${p.designacion} &middot; Código ${p.codigo}<br>` +
        `Superficie: ${p.superficie_ha.toLocaleString('es-CL')} ha &middot; Protegido desde ${p.ano_proteccion}<br>` +
        `<a href="${p.url}" target="_blank">Ficha SIMBIO</a>`
      );
    }
  }).addTo(map);

  // 7. Ajustar el mapa a los límites de ambas capas
  const combinedBounds = ramsarLayer.getBounds().extend(parqueLayer.getBounds());
  map.fitBounds(combinedBounds);

  // 8. Leyenda interactiva (checkboxes para mostrar/ocultar cada capa)
  const Legend = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const container = L.DomUtil.create('div', 'leaflet-bar');
      container.style.background = '#fff';
      container.style.padding = '10px 12px';
      container.style.lineHeight = '1.4';

      container.innerHTML = `
        <div class="legend-title">Capas</div>
        <div class="legend-row">
          <input type="checkbox" id="toggle-ramsar" checked>
          <span class="legend-swatch" style="background:${RAMSAR_COLOR}; border:1px solid #00766D;"></span>
          <label for="toggle-ramsar">Sitio Ramsar</label>
        </div>
        <div class="legend-row">
          <input type="checkbox" id="toggle-parque" checked>
          <span class="legend-swatch" style="background:${PARQUE_COLOR}; border:1px solid #A66F1E;"></span>
          <label for="toggle-parque">Parque Nacional</label>
        </div>
      `;

      // Evitar que los clicks en el control muevan/hagan zoom en el mapa
      L.DomEvent.disableClickPropagation(container);

      container.querySelector('#toggle-ramsar').addEventListener('change', (e) => {
        if (e.target.checked) {
          map.addLayer(ramsarLayer);
        } else {
          map.removeLayer(ramsarLayer);
        }
      });

      container.querySelector('#toggle-parque').addEventListener('change', (e) => {
        if (e.target.checked) {
          map.addLayer(parqueLayer);
        } else {
          map.removeLayer(parqueLayer);
        }
      });

      return container;
    }
  });

  map.addControl(new Legend());
