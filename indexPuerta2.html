<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de luz</title>
<style>
  :root {
    --fondo: #14171a;
    --superficie: #1e2226;
    --texto: #e7e6e2;
    --texto-tenue: #8b9096;
    --amarillo: #f2b705;
    --amarillo-apagado: #3a3630;
    --linea: #2c3136;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--fondo);
    color: var(--texto);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .tarjeta {
    width: 100%;
    max-width: 340px;
    background: var(--superficie);
    border: 1px solid var(--linea);
    border-radius: 18px;
    padding: 32px 28px 28px;
    text-align: center;
  }

  .titulo {
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--texto-tenue);
    margin: 0 0 28px;
  }

  .boton {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: none;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--amarillo-apagado);
    transition: background 0.25s ease, box-shadow 0.25s ease;
    padding: 0;
  }

  .boton.encendido {
    background: var(--amarillo);
    box-shadow: 0 0 40px 6px rgba(242, 183, 5, 0.45);
  }

  .boton svg {
    width: 64px;
    height: 64px;
    stroke: var(--fondo);
    stroke-width: 1.6;
    fill: none;
    opacity: 0.45;
    transition: opacity 0.25s ease;
  }

  .boton.encendido svg {
    opacity: 1;
  }

  .estado {
    margin-top: 24px;
    font-size: 14px;
    color: var(--texto-tenue);
  }

  .estado .valor {
    color: var(--texto);
  }

  .punto {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--texto-tenue);
    margin-right: 6px;
  }

  .punto.conectado {
    background: #4caf7d;
  }

  .conexion {
    margin-top: 16px;
    font-size: 12px;
    color: var(--texto-tenue);
  }
</style>
</head>
<body>

<div class="tarjeta">
  <p class="titulo">Luz de la sala</p>

  <button class="boton" id="boton">
    <svg viewBox="0 0 24 24">
      <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6v.5h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"/>
    </svg>
  </button>

  <p class="estado">Estado <span class="valor" id="texto-estado">desconocido</span></p>

  <p class="conexion">
    <span class="punto" id="punto-conexion"></span>
    <span id="texto-conexion">conectando al servidor</span>
  </p>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
  // Este identificador tiene que ser exactamente igual al que
  // pusiste en ID_UNICO dentro del codigo del ESP32.
  const idUnico = "cambia-esto-por-algo-unico-123";

  const topicComando = `casa/${idUnico}/rele/comando`;
  const topicEstado = `casa/${idUnico}/rele/estado`;

  const boton = document.getElementById("boton");
  const textoEstado = document.getElementById("texto-estado");
  const textoConexion = document.getElementById("texto-conexion");
  const puntoConexion = document.getElementById("punto-conexion");

  let encendido = false;

  const cliente = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

  cliente.on("connect", () => {
    textoConexion.textContent = "conectado al servidor";
    puntoConexion.classList.add("conectado");
    cliente.subscribe(topicEstado);
  });

  cliente.on("reconnect", () => {
    textoConexion.textContent = "reconectando";
    puntoConexion.classList.remove("conectado");
  });

  cliente.on("close", () => {
    textoConexion.textContent = "sin conexion";
    puntoConexion.classList.remove("conectado");
  });

  cliente.on("message", (topic, mensaje) => {
    if (topic === topicEstado) {
      const valor = mensaje.toString().trim();
      actualizarInterfaz(valor === "ON");
    }
  });

  function actualizarInterfaz(estaEncendido) {
    encendido = estaEncendido;
    boton.classList.toggle("encendido", encendido);
    textoEstado.textContent = encendido ? "encendida" : "apagada";
  }

  boton.addEventListener("click", () => {
    const nuevoValor = encendido ? "OFF" : "ON";
    cliente.publish(topicComando, nuevoValor);
  });
</script>

</body>
</html>
