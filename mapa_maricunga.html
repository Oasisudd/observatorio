<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="stylesheet" href="./css/style.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salar de Maricunga — Clasificación de paisajes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

</head>
<body>

<header>
  <h1>Salar de Maricunga — Clasificación de paisajes</h1>
  <p>Índices espectrales (NDVI/NDWI/brillo) + Satellite Embedding · Google Earth Engine</p>
</header>

<div class="layout">
  <div id="mapa"></div>

  <div class="panel">
    <div class="card">
      <h2>Leyenda</h2>
      <div id="leyenda"></div>
    </div>

    <div class="card">
      <h2>Superficie de vegetación</h2>
      <div id="estadisticas">
        <p id="estado-carga">Cargando…</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  // ══════════════════════════════════════════════════════════════════════════
  // CONFIGURACIÓN — reemplaza estos 3 valores con los que te dio el notebook
  // ══════════════════════════════════════════════════════════════════════════

  // 1) Ruta o URL de la imagen PNG ya coloreada (convertida desde el .tif que
  //    exportó el notebook — el navegador no puede leer GeoTIFF directamente).
  const URL_IMAGEN = 'maricunga_clase.png';

  // 2) Límites geográficos exactos [[lat_sur, lon_oeste], [lat_norte, lon_este]].
  //    Este es el valor que imprimió la celda de exportación del notebook
  //    (también queda guardado en maricunga_bounds.json si prefieres cargarlo).
  const BOUNDS = [[-27.10, -69.20], [-27.05, -69.14]]; // <-- REEMPLAZAR

  // 3) Nombre y color de cada clase, en el mismo orden 1..7 del notebook
  //    (paleta_clases / NOMBRES_CLASE).
  const CLASES = [
    { nombre: 'Agua',                              color: '#1f78b4' },
    { nombre: 'Algas (laguna)',                    color: '#e7298a' },
    { nombre: 'Salar / costra salina',             color: '#e6ab02' },
    { nombre: 'Suelo desnudo',                     color: '#a6761d' },
    { nombre: 'Pajonal hídrico',                   color: '#fee08b' },
    { nombre: 'Vega',                              color: '#66bd63' },
    { nombre: 'Bofedal',                           color: '#1a9850' },
  ];

  // 4) Ruta o URL del JSON de superficies que exportó el notebook
  //    (maricunga_area_vegetacion.json). Si prefieres no usar fetch (por
  //    ejemplo al abrir el HTML directo desde el disco, sin servidor), puedes
  //    pegar el contenido de ese JSON directo en la constante ESTADISTICAS_FALLBACK.
  const URL_ESTADISTICAS = 'maricunga_area_vegetacion.json';

  const ESTADISTICAS_FALLBACK = {
    clases: [
      { nombre: 'Pajonal hídrico', color: '#fee08b', km2: 0 },
      { nombre: 'Vega',            color: '#66bd63', km2: 0 },
      { nombre: 'Bofedal',         color: '#1a9850', km2: 0 },
    ],
    total_vegetacion_km2: 0,
  };

  // ══════════════════════════════════════════════════════════════════════════
  // A partir de acá no debería hacer falta tocar nada
  // ══════════════════════════════════════════════════════════════════════════

  const mapa = L.map('mapa', { zoomSnap: 0.25 });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(mapa);

  L.imageOverlay(URL_IMAGEN, BOUNDS, { opacity: 0.85 }).addTo(mapa);
  mapa.fitBounds(BOUNDS);

  // Leyenda
  const leyendaDiv = document.getElementById('leyenda');
  CLASES.forEach(c => {
    const fila = document.createElement('div');
    fila.className = 'legend-row';
    fila.innerHTML = `<span class="swatch" style="background:${c.color}"></span><span>${c.nombre}</span>`;
    leyendaDiv.appendChild(fila);
  });

  // Estadísticas (con fallback si no hay servidor sirviendo el JSON)
  function pintarEstadisticas(datos) {
    const cont = document.getElementById('estadisticas');
    cont.innerHTML = '';
    datos.clases.forEach(c => {
      const fila = document.createElement('div');
      fila.className = 'stat-row';
      fila.innerHTML = `
        <span class="stat-name"><span class="swatch" style="background:${c.color}"></span>${c.nombre}</span>
        <span class="stat-value">${c.km2.toFixed(2)} km²</span>`;
      cont.appendChild(fila);
    });
    const total = document.createElement('div');
    total.className = 'total-row';
    total.innerHTML = `<span>Total vegetación</span><span>${datos.total_vegetacion_km2.toFixed(2)} km²</span>`;
    cont.appendChild(total);
  }

  fetch(URL_ESTADISTICAS)
    .then(r => r.json())
    .then(pintarEstadisticas)
    .catch(() => pintarEstadisticas(ESTADISTICAS_FALLBACK));
</script>

</body>
</html>
